<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atualização</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: transparent;
      color: #102234;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
    }

    main {
      min-height: 64px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: transparent;
      flex-wrap: wrap;
    }

    .status {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    #message {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    #last {
      color: #ffffff;
      font-size: 12px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border: 1px solid #102234;
      border-radius: 6px;
      background: #102234;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: #8c969f;
      border-color: #8c969f;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #details,
    #configStatus {
      margin: 0;
      padding: 0 16px 10px;
      font-size: 12px;
      white-space: pre-wrap;
    }

    #details {
      color: #b42318;
    }

    #configStatus {
      color: #102234;
    }

    #details:empty,
    #configStatus:empty {
      display: none;
    }

    @media (max-width: 360px) {
      main {
        align-items: flex-start;
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>

  <script defer src="vendor/tableau.extensions.js"></script>
  <script defer src="app.js"></script>
</head>

<body>
  <main>
    <div class="status" role="status" aria-live="polite">
      <div id="message">Conectando ao Tableau…</div>
      <small id="last">Última atualização completa: —</small>
    </div>

    <button id="refresh" type="button" disabled>
      <span aria-hidden="true">↻</span>
      Atualizar agora
    </button>
  </main>

  <p id="configStatus" role="status" aria-live="polite"></p>
  <p id="details"></p>
</body>
</html>
