<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barras por Hora</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css?v=1.0.0">
<script defer src="vendor/tableau.extensions.js"></script>
<script defer src="app.js?v=1.0.0"></script>
</head>
<body class="light card-on">
<button id="configure" type="button" hidden>Configurar</button>
<main>
  <section class="panel">
    <header class="section-head">
      <svg class="section-icon" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 28V18h6v10ZM13 28V10h6v18ZM22 28V4h6v24Z" fill="currentColor"/></svg>
      <div class="head-text"><h1 id="sectionTitle"></h1><div id="sectionSubtitle"></div></div>
      <div class="legend"><span><i id="legDone"></i><b id="legDoneText" style="font-weight:400"></b></span><span><i id="legFuture"></i><b id="legFutureText" style="font-weight:400"></b></span></div>
    </header>
    <div id="chart" class="chart"><svg id="svg"></svg></div>
    <p id="notice" role="status">Conectando ao Tableau…</p>
  </section>
</main>

<section id="settingsPanel" hidden aria-label="Configuração do gráfico">
  <form id="settingsForm" novalidate>
    <h2>Configurar barras</h2>
    <p class="hint">Entradas: <strong>Categoria</strong> (ORDEM_LINHA + HORA) e <strong>Valor</strong> (CANA).</p>
    <fieldset class="group"><legend>Cabeçalho</legend>
      <label class="checkbox"><input id="showHeaderInput" type="checkbox"> Exibir cabeçalho</label>
      <label>Título<input id="titleInput" maxlength="80"></label>
      <label>Subtítulo<input id="subtitleInput" maxlength="120"></label>
      <label class="checkbox"><input id="showLegendInput" type="checkbox"> Exibir legenda</label>
      <div class="two"><label>Legenda realizada<input id="legDoneInput" maxlength="40"></label><label>Legenda futura<input id="legFutureInput" maxlength="40"></label></div>
    </fieldset>
    <fieldset class="group"><legend>Dados</legend>
      <label>Ignorar categorias (separe por vírgula)<input id="excludeInput" maxlength="200"></label>
      <label>Horários futuros<select id="futureModeInput">
        <option value="afterLast">Nulos e zeros depois da última hora com produção</option>
        <option value="null">Somente valores nulos</option>
        <option value="none">Não destacar (mostrar 0)</option>
      </select></label>
      <div class="two"><label>Casas decimais<select id="decimalsInput"><option>0</option><option>1</option><option>2</option></select></label>
      <label>Título do eixo Y<input id="yTitleInput" maxlength="30"></label></div>
      <label class="checkbox"><input id="showLabelsInput" type="checkbox"> Valores em cima das barras</label>
      <label class="checkbox"><input id="showGridInput" type="checkbox"> Linhas de grade</label>
    </fieldset>
    <fieldset class="group"><legend>Aparência</legend>
      <div class="color-grid">
        <label>Barras<input id="colorBarInput" type="color"></label>
        <label>Horário futuro<input id="colorFutureInput" type="color"></label>
        <label>Ícone<input id="colorAccentInput" type="color"></label>
        <label>Textos<input id="colorTextInput" type="color"></label>
      </div>
      <label>Largura das barras: <output id="barWidthValue"></output><input id="barWidthInput" type="range" min="30" max="95" step="5"></label>
      <label>Fonte do gráfico: <output id="fontValue"></output><input id="fontInput" type="range" min="9" max="18" step="1"></label>
      <label class="checkbox"><input id="showCardInput" type="checkbox"> Borda, sombra e cantos</label>
      <label>Fundo da área<select id="themeInput"><option value="light">Branco</option><option value="gray">Cinza claro</option><option value="transparent">Transparente</option></select></label>
    </fieldset>
    <p id="saveStatus" role="status"></p>
    <div class="actions"><button id="close" type="button">Fechar</button><button id="save" type="submit">Salvar configuração</button></div>
  </form>
</section>
</body>
</html>
