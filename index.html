<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tableau TV • Intervalo configurável</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102234;color:#ecf5fc;font:14px system-ui,sans-serif}main{padding:12px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}.brand{font-weight:750;letter-spacing:.04em;color:#64dfc0}.status{flex:1;min-width:190px}#message{font-weight:600}small{display:block;color:#b2c5d7;margin-top:4px}button{background:#1d3a51;color:white;border:1px solid #52728c;border-radius:6px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}#details{color:#ffd594;white-space:pre-wrap;margin:0;padding:0 16px 12px;font-size:12px}#details:empty{display:none}
form{display:flex;align-items:center;gap:8px;flex-wrap:wrap}input{width:92px;padding:8px;background:#19384f;color:#fff;border:1px solid #52728c;border-radius:6px;font:inherit}#configStatus{padding:0 16px 12px;margin:0;color:#b2c5d7;font-size:12px}#configStatus:empty{display:none}
</style><script defer src="vendor/tableau.extensions.js"></script><script defer src="app.js"></script></head>
<body><main><span class="brand">TV · <span id="activeInterval">30s</span></span><div class="status" role="status" aria-live="polite"><div id="message">Conectando ao Tableau…</div><small id="last">Última atualização completa: —</small></div><form id="intervalForm" novalidate><label for="seconds">Intervalo (segundos)</label><input id="seconds" type="number" min="1" max="86400" step="1" value="30" disabled><button id="apply" type="submit" disabled>Aplicar</button></form><span id="countdown">—</span><button id="refresh" disabled>Atualizar agora</button><button id="pause" disabled>Pausar</button></main><p id="configStatus" role="status" aria-live="polite"></p><p id="details"></p></body></html>
